services:
  quickwit:
    # Pinned to the Quickwit version qwui is deployed against. `edge` is
    # silently a different Quickwit, which makes local checks of the API surface
    # worthless: they would record edge's endpoints, not the ones a real cluster
    # serves. Bump this together with the real upgrade.
    image: quickwit/quickwit:v0.9.0
    pull_policy: missing
    ports:
      - "7280:7280"
    volumes:
      - quickwit_data:/quickwit/qwdata
    command: run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7280/health/livez"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qwui:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - QUICKWIT_URL=http://quickwit:7280
      - PORT=8080
    depends_on:
      quickwit:
        condition: service_healthy
    profiles:
      - backend

  data-generator:
    image: python:3.12-alpine
    depends_on:
      quickwit:
        condition: service_healthy
    volumes:
      - ./dev:/scripts
    command: python /scripts/generate.py
    restart: unless-stopped

  trace-generator:
    image: python:3.12-alpine
    depends_on:
      quickwit:
        condition: service_healthy
    volumes:
      - ./dev:/scripts
    environment:
      - QUICKWIT_URL=http://quickwit:7280
      - TRACE_RATE=3
    command: python /scripts/generate-traces.py
    restart: unless-stopped

volumes:
  quickwit_data:
